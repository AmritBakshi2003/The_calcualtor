name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build:web

      # Production is served by the Cloudflare Git integration (see README), so a
      # push to master already deploys. This Actions deploy is an extra path and
      # only runs when its credentials are configured; otherwise every push would
      # end in a red X while production is in fact up to date.
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for this repository, so the Actions deploy is skipped. Production is deployed by the Cloudflare Git integration; add the secrets to re-enable this workflow."
            exit 0
          fi
          # Presence is not enough: a rotated-away or scope-restricted token
          # must SKIP the deploy with a notice, not fail the whole push red
          # (wrangler reports invalid tokens as API error 9109).
          if npx wrangler whoami 2>/dev/null | grep -q "You are logged in"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is set but rejected by the Cloudflare API (error 9109 usually means the token was revoked or its IP restrictions changed). The Actions deploy is skipped; production is deployed by the Cloudflare Git integration. Rotate the token to re-enable this workflow."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
